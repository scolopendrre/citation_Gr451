<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
	
	body { font-family: "Exo", sans-serif; }
	div { color: blue; }
	.quote{font-size: 3rem; }
	.source{
		font-style: italic; 
	margin-top: 1rem;
	}

	.citation{
		margin: 2rem;
		border: 1px solid magenta;
		padding: 1rem;
		border-radius: 1rem;
		aspect-ratio: 16/9;
	}

	.important{ background: greenyellow; }

#pepito{ background: red;}
#pickle{ background: pink;}

</style>

</head>
<body>
	
<div class="citation" id="pepito">
	<div class="quote important">"Reprise d'une phrase marquante d'un auteur, d'un philosophe ou d'un artiste."</div>
	<div class="source">–Google, prolly</div>

</div>

<div class="citation" id="pickle">
	<div class="quote">eughghghhh
		uuuuhhh</div>
	<div class="source">–the ugliest thing I've intentionally made</div>
</div>

</body>
</html>
